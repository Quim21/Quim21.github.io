name: Estadísticas de Gem Rush

# Cada hora consulta la API pública de Roblox y añade una muestra al histórico.
# El histórico vive en la rama `datos` (un único commit que se reescribe), así `main`
# no se llena de commits automáticos y la web no tiene que recompilarse: la página
# /gem-rush/ lee el JSON directamente desde raw.githubusercontent.com.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estadisticas
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Recuperar el histórico
        run: |
          mkdir -p datos
          if git fetch --depth=1 origin datos; then
            git show FETCH_HEAD:gem-rush.json > datos/gem-rush.json
          fi

      - name: Añadir una muestra
        run: node scripts/estadisticas-roblox.mjs datos/gem-rush.json

      - name: Guardar en la rama datos
        working-directory: datos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gem-rush.json
          git commit -qm "Estadísticas de Gem Rush ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
